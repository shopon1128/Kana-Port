<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="自作アプリの一覧。日々の困りごとを解消するために作り、実際に使い続けているツールを配布しています。">
  <title>Apps | Kana's Portfolio</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="../works.css">
</head>
<body>
  <header>
    <a class="back-link" href="../index.html">← トップへ戻る</a>
    <h1>Apps</h1>
    <p class="page-sub">日々の困りごとを解消するために作ったツール</p>
  </header>

  <main>
    <!-- 並び替え（sort.js）と絞り込み（filter.js）。中身は JS が生成するので
         ここにボタンを手書きしない。
         いまはカードが1件しかないので sort.js は並び替えボタンを出さない。
         そのため見出しも「絞り込み」にしてある。2件目を足したら
         「並び替え・絞り込み」に直すこと（verify.py が件数と照合して検出する）。
         作品を追加するときは <article class="work-card" data-tags="..."> を
         1つコピーして、data-tags と .work-tags のチップを一致させる -->
    <details class="works-tools">
      <summary>絞り込み</summary>
      <div class="sort" id="sort" role="group" aria-label="並び替え"></div>
      <div class="filter" id="filter" role="group" aria-label="タグで絞り込み"></div>
    </details>
    <p class="filter-status" id="filter-status" role="status"></p>

    <div class="works-list" id="works-list">

      <article class="work-card" data-tags="Python,SQLite,macOS,ダウンロード,個人制作,詳細ページあり">
        <div class="work-thumb">
          <img src="Images/BookLib.png" alt="BookLib の画面">
        </div>
        <h2 class="work-title">
          <a href="BookLib/">BookLib</a>
        </h2>
        <div class="work-desc">
          PDF管理アプリです。<br>PDFで保存している書籍を、Finderよりも管理しやすくしたいという思いで制作しました。<br>
          ジャンルや著者名で検索したり、ファイル名は弄らずにタイトルを変更して管理したりできます。
        </div>
        <p class="work-meta">
          <span><time datetime="2026-07">2026年7月</time></span>
          <span>制作1日</span>
        </p>
        <div class="work-tags">
          <button type="button" class="tag" data-tag="Python">Python</button>
          <button type="button" class="tag" data-tag="SQLite">SQLite</button>
          <button type="button" class="tag" data-tag="macOS">macOS</button>
          <button type="button" class="tag" data-tag="ダウンロード">ダウンロード</button>
          <button type="button" class="tag" data-tag="個人制作">個人制作</button>
          <button type="button" class="tag" data-tag="詳細ページあり">詳細ページあり</button>
        </div>
      </article>

    </div>

    <p class="no-result" id="no-result" hidden>該当する作品がありません。</p>
  </main>

  <footer><p>© 2026 山口奏輝</p></footer>

  <script defer src="../sort.js"></script>
  <script defer src="../filter.js"></script>
</body>
</html>
